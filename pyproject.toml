[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breachlab"
version = "0.1.0"
description = "BreachLab — Enterprise Pentesting Training Environment (Local & Isolated Cyber Range)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
breachlab = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "orchestrator*", "validation*", "scenario_engine*", "synthetic_data*", "vulnerability_catalog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
