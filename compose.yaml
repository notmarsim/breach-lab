name: breachlab

networks:
  external:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bl-ext
    ipam:
      config:
        - subnet: ${BREACHLAB_NET_EXTERNAL:-10.10.10.0/24}
  dmz:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bl-dmz
    ipam:
      config:
        - subnet: ${BREACHLAB_NET_DMZ:-10.10.20.0/24}
  internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-bl-int
    ipam:
      config:
        - subnet: ${BREACHLAB_NET_INTERNAL:-10.10.30.0/24}
  database:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-bl-db
    ipam:
      config:
        - subnet: ${BREACHLAB_NET_DATABASE:-10.10.40.0/24}
  restricted:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-bl-res
    ipam:
      config:
        - subnet: ${BREACHLAB_NET_RESTRICTED:-10.10.50.0/24}
  management:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-bl-mgmt
    ipam:
      config:
        - subnet: ${BREACHLAB_NET_MANAGEMENT:-10.10.60.0/24}

volumes:
  db_postgres_data:
  cc_state_data:

services:
  # --- Core & Management Plane ---
  lab-proxy:
    image: nginx:1.27-alpine
    container_name: breachlab-proxy
    hostname: proxy.nexora.test
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infrastructure/networking/nginx-dmz.conf:/etc/nginx/nginx.conf:ro
    networks:
      - external
      - dmz
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 5s
      retries: 3

  lab-health:
    image: python:3.12-alpine
    container_name: breachlab-health
    hostname: health.mgmt.nexora.test
    profiles: ["core"]
    restart: unless-stopped
    command: ["python3", "-m", "http.server", "8081", "--bind", "0.0.0.0"]
    networks:
      - management
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.20"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  control-center:
    build:
      context: .
      dockerfile: control_center/backend/Dockerfile
    container_name: breachlab-control-center
    hostname: control.mgmt.nexora.test
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - cc_state_data:/app/.breachlab
    networks:
      - management
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Database Tier (internal: true) ---
  db01-postgres:
    image: postgres:16-alpine
    container_name: breachlab-db01
    hostname: db01.nexora.test
    profiles: ["web", "api", "infrastructure", "full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_synth_db_pass
      POSTGRES_DB: nexora_corp
    volumes:
      - db_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_corp"]
      interval: 15s
      timeout: 5s
      retries: 5

  cache01-redis:
    image: redis:7-alpine
    container_name: breachlab-cache01
    hostname: cache01.nexora.test
    profiles: ["web", "api", "infrastructure", "full"]
    restart: unless-stopped
    networks:
      - database
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- DMZ Web Applications ---
  corporate-website:
    build: ./applications/corporate-website
    container_name: breachlab-web01
    hostname: www.nexora.test
    profiles: ["web"]
    restart: unless-stopped
    volumes:
      - ./synthetic_data/dataset.json:/data/dataset.json:ro
    networks:
      - dmz
      - database
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.35"

  ecommerce:
