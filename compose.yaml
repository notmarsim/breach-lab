      - restricted
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.30"

  # --- APIs ---
  api-rest:
    build: ./apis/rest
    container_name: breachlab-api01
    hostname: api.nexora.test
    profiles: ["api"]
    restart: unless-stopped
