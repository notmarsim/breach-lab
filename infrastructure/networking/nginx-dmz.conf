events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name www.nexora.test;
    location / {
      set $upstream_corp corporate-website:8000;
      proxy_pass http://$upstream_corp;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name shop.nexora.test;
    location / {
      set $upstream_shop ecommerce:3000;
      proxy_pass http://$upstream_shop;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name portal.nexora.test;
    location / {
      set $upstream_portal customer-portal:8000;
      proxy_pass http://$upstream_portal;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name support.nexora.test;
    location / {
      set $upstream_sup helpdesk:8000;
      proxy_pass http://$upstream_sup;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name intranet.nexora.test;
    location / {
      set $upstream_intra intranet:80;
      proxy_pass http://$upstream_intra;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name finance.nexora.test;
    location / {
      set $upstream_fin finance:8000;
      proxy_pass http://$upstream_fin;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name mail.nexora.test;
    location / {
      set $upstream_mail webmail:8000;
      proxy_pass http://$upstream_mail;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name files.nexora.test;
    location / {
      set $upstream_files file-manager:8080;
      proxy_pass http://$upstream_files;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name legacy.nexora.test;
    location / {
      set $upstream_leg legacy-portal:80;
      proxy_pass http://$upstream_leg;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name api.nexora.test;
    location / {
      set $upstream_rest api-rest:8000;
      proxy_pass http://$upstream_rest;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name api02.nexora.test;
    location / {
      set $upstream_gql api-graphql:8000;
      proxy_pass http://$upstream_gql;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name soap.nexora.test;
    location / {
      set $upstream_soap api-soap:8000;
      proxy_pass http://$upstream_soap;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name ws.nexora.test;
    location / {
      set $upstream_ws api-websocket:8000;
      proxy_pass http://$upstream_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
