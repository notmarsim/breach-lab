events { worker_connections 1024; }

http {
  server {
    listen 80 default_server;
    server_name www.nexora.test;
    location / {
      proxy_pass http://corporate-website:8000;
      proxy_set_header Host $host;
    }
  }
  server {
    listen 80;
    server_name shop.nexora.test;
    location / {
      proxy_pass http://ecommerce:3000;
      proxy_set_header Host $host;
    }
  }
  server {
    listen 80;
    server_name portal.nexora.test;
    location / {
      proxy_pass http://customer-portal:8000;
      proxy_set_header Host $host;
    }
  }
  server {
    listen 80;
    server_name api.nexora.test;
    location / {
      proxy_pass http://api-rest:8000;
      proxy_set_header Host $host;
    }
  }
}
