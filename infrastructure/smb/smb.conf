[global]
   workgroup = NEXORA
   server string = Nexora Corporate File Server (FILE01)
   security = user
   map to guest = Bad User
   log file = /var/log/samba/log.%m
   max log size = 1000

[public_docs]
   path = /srv/samba/public_docs
   browseable = yes
   read only = yes
   guest ok = yes

[engineering]
   path = /srv/samba/engineering
   browseable = yes
   read only = no
   guest ok = no
